services:
  wordlebot:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}  # shown by /version; set by update.sh
    image: wordlebot
    restart: unless-stopped
    # Python is PID 1 and has no SIGTERM handler, so the kernel drops Docker's
    # default stop signal and the container gets SIGKILLed after the grace
    # period. SIGINT raises KeyboardInterrupt instead: asyncio.run cancels the
    # main task and `async with bot:` closes the gateway session (main() exits 0).
    # The image declares STOPSIGNAL SIGINT too; this keeps it explicit.
    stop_signal: SIGINT
    env_file: .env
    volumes:
      # Long syntax so a missing config.toml is an error instead of Docker
      # creating a root-owned directory at that path.
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - wordlebot-state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wordlebot-state:
