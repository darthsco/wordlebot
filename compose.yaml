services:
  wordlebot:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}  # shown by /version; set by update.sh
    image: wordlebot
    restart: unless-stopped
    # Python is PID 1 and has no SIGTERM handler, so the kernel drops Docker's
    # default stop signal and the container gets SIGKILLed after the grace
    # period. SIGINT raises KeyboardInterrupt instead: asyncio.run cancels the
    # main task and `async with bot:` closes the gateway session (main() exits 0).
    # The image declares STOPSIGNAL SIGINT too; this keeps it explicit.
    stop_signal: SIGINT
    env_file: .env
    environment:
      # The admin panel's passkeys are tied to its domain (Caddy serves the same one).
      WORDLEBOT_WEB_DOMAIN: ${PANEL_DOMAIN:-localhost}
    volumes:
      # Long syntax so a missing config.toml is an error instead of Docker
      # creating a root-owned directory at that path.
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - wordlebot-state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS reverse proxy for the admin panel. Only started with the "web" profile
  # (COMPOSE_PROFILES=web in .env). The bot's panel port is never published: only
  # Caddy reaches it, over the compose network.
  caddy:
    image: caddy:2.10-alpine
    profiles: [web]
    restart: unless-stopped
    depends_on: [wordlebot]
    environment:
      # Unset, Caddy serves only "localhost" with its own untrusted certificate.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data      # certificates; keep it, or Let's Encrypt rate limits bite
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wordlebot-state:
  caddy-data:
  caddy-config:
