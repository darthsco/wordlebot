{% extends "base.html" %}
{% block content %}
<form method="post" action="/login/code" class="card narrow" hx-boost="false">
  <h1>Authenticator code</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>6-digit code <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required autofocus></label>
  <button>Sign in</button>
  <p class="muted"><a href="/login">Start over</a></p>
</form>
{% endblock %}
